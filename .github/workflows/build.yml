name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q FlauGram.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: FlauGram/android
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: flaugram-apk
          path: FlauGram/android/app/build/outputs/apk/debug/app-debug.apk

      # Публикуем релиз: именно оттуда приложение берёт обновления и там же лежит ссылка на скачивание
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(grep -oP 'versionCode\s+\K[0-9]+' FlauGram/android/app/build.gradle | head -1)
          NAME=$(grep -oP "versionName\s+'\K[^']+" FlauGram/android/app/build.gradle | head -1)
          cp FlauGram/android/app/build/outputs/apk/debug/app-debug.apk FlauGram.apk
          gh release delete "v$CODE" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "v$CODE" FlauGram.apk --repo "$GITHUB_REPOSITORY" \
            --title "FlauGram $NAME" --notes "FlauGram $NAME" --latest --target "$GITHUB_SHA"
